<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo TI - Login</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="assets/gt" href="assets/icone-gtm.ico">
</head>

<body class="login-body">

    <main class="login-container">

        <div class="login-card">

            <div class="login-logo">
                <img src="assets/icone-gtm.png" alt="GTM">
            </div>

            <h1>Termo TI</h1>

            <p class="login-subtitle">
                Acesso administrativo ao sistema de termos de responsabilidade
            </p>

            <form id="acessoColaborador" class="hidden" novalidate>
                <div class="login-field">
                    <label for="nomeCompleto">Nome completo</label>
                    <input id="nomeCompleto" autocomplete="name" maxlength="200" aria-describedby="mensagemColaborador" required>
                </div>
                <div class="login-field">
                    <label for="cpfLogin">CPF/CNPJ</label>
                    <input id="cpfLogin" inputmode="numeric" maxlength="18" autocomplete="username" aria-describedby="mensagemColaborador" placeholder="CPF ou CNPJ" required>
                </div>
                <div id="etapaSenha" class="hidden">
                    <p id="orientacaoSenha"></p>
                    <div class="login-field">
                        <label for="senhaPessoal">Senha</label>
                        <input id="senhaPessoal" type="password" maxlength="128" autocomplete="current-password" aria-describedby="mensagemColaborador">
                        <button type="button" id="mostrarSenha" class="btn-secondary" aria-pressed="false">Mostrar senha</button>
                    </div>
                    <div id="confirmacaoSenha" class="login-field hidden">
                        <label for="confirmarSenha">Confirme a senha</label>
                        <input id="confirmarSenha" type="password" autocomplete="new-password" maxlength="128" aria-describedby="mensagemColaborador">
                    </div>
                </div>
                <button id="continuarLogin" type="submit" class="login-button">Continuar</button>
                <p id="mensagemColaborador" role="status" aria-live="polite"></p>
                <button id="alterarIdentificacao" type="button" class="btn-secondary hidden">Alterar nome ou CPF</button>
                <a href="index.html" class="login-back-link">Voltar à escolha de acesso</a>
            </form>

            <form id="loginForm">

                <div class="login-field">
                    <label for="usuario">Usuário</label>

                    <input
                        type="text"
                        id="usuario"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Entrar
                </button>

                <p id="mensagem"></p>

                <a href="index.html" class="login-back-link">Voltar à escolha de acesso</a>

            </form>

        </div>

    </main>

    <script src="js/login.js"></script>
    <script src="js/login-colaborador.js"></script>

</body>
</html>
