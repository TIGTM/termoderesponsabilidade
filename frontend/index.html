<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termos de Responsabilidade - GTM</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="assets/gt" href="assets/icone-gtm.ico">
</head>
<body class="login-body">

    <main class="login-container">

        <div class="login-card">

            <div class="login-logo">
                <img src="assets/icone-gtm.png" alt="GTM">
            </div>

            <h1>Termos de Responsabilidade</h1>

            <p class="login-subtitle">
                Sistema de gerenciamento de termos de responsabilidade de equipamentos de TI
            </p>

            <div class="access-options">

                <button class="access-card" onclick="window.location.href='admin.html'">
                    <div class="access-icon">⚙</div>

                    <div class="access-content">
                        <strong>Administrador</strong>
                        <span>Gerenciar equipamentos e termos</span>
                    </div>
                </button>

                <button class="access-card" onclick="window.location.href='login.html?perfil=colaborador'">
                    <div class="access-icon">👤</div>

                    <div class="access-content">
                        <strong>Colaborador</strong>
                        <span>Consultar e assinar seu termo</span>
                    </div>
                </button>

            </div>

        </div>

    </main>

</body>
</html>
